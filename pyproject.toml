[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gillsystems-ai-stack-updater-enterprise"
version = "0.1.0-enterprise"
description = "Enterprise edition: policy-driven updates, fleet orchestration, audit log, rollback. Private fork of public AI Stack Updater."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Proprietary" }
authors = [
    { name = "Gillsystems", email = "contact@gillsystems.ca" },
]
keywords = ["rocm", "hip", "llama.cpp", "amd", "gpu", "updater", "automation", "enterprise", "policy", "audit", "fleet"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: Other/Proprietary License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]
dependencies = [
    "httpx>=0.27.0,<1",
    "rich>=13.7.0,<14",
    "pydantic>=2.7.0,<3",
    "pydantic-settings>=2.3.0,<3",
    "packaging>=24.0,<25",
    "PyYAML>=6.0.1,<7",
    "cryptography>=42.0.0,<43",  # For audit hash chaining
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.23,<1",
    "pytest-mock>=3.14,<4",
    "responses>=0.25,<1",
    "coverage>=7.5,<8",
]
enterprise = [
    "paramiko>=3.4.0,<4",  # SSH for fleet
    "msal>=1.25.0,<2",     # Azure AD auth
    "hvac>=2.1.0,<3",      # HashiCorp Vault
    "azure-keyvault-secrets>=4.7.0,<5",
    "boto3>=1.34.0,<2",    # AWS Secrets Manager
    "jinja2>=3.1.0,<4",    # Report templates
]

[project.scripts]
gillsystems-ai-stack-updater-enterprise = "src.main:main"
gillsystems-ai-stack-updater = "src.main:main"  # Alias for compatibility

[project.urls]
Homepage = "https://github.com/OCNGill/Gillsystems-AI-Stack-Updater-Enterprise"
Repository = "https://github.com/OCNGill/Gillsystems-AI-Stack-Updater-Enterprise"
Issues = "https://github.com/OCNGill/Gillsystems-AI-Stack-Updater-Enterprise/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false